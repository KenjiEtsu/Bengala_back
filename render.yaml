databases:
  - name: bengala-db
    plan: free
    region: frankfurt

services:
  - type: web
    runtime: node
    name: bengala-backend
    region: frankfurt
    plan: free
    branch: main
    healthCheckPath: /health
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm prisma migrate deploy && pnpm build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bengala-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DOCS_MASTER_KEY
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
